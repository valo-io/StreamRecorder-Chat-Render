<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VOD Chat Replay</title>
  <link rel="stylesheet" href="vendor/plyr/plyr.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <label class="file">VOD
      <input id="vodFile" type="file" accept="video/*,.mp4,.webm,.mkv,.ts">
    </label>
    <label class="file">Chat JSON
      <input id="jsonFile" type="file" accept=".json,application/json">
    </label>
    <input id="channelUrl" placeholder="https://www.twitch.tv/channel">
    <button id="loadBtn">Load</button>
    <label class="offset">Offset (ms)
      <input id="offsetMs" type="text" inputmode="numeric" value="0" maxlength="10" size="10">
    </label>
    <span id="status"></span>
  </header>
  <main>
    <div id="playerWrap">
      <video id="video" controls></video>
    </div>
    <aside id="sidebar">
      <div id="chatHeader">Chat replay</div>
      <div id="chat"></div>
    </aside>
  </main>
  <script src="vendor/plyr/plyr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
